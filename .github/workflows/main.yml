name: GC cutoff evidence

on:
  push:
    branches:
      - gc-evidence/pr396-2386b7c

permissions:
  contents: read
  statuses: write
  issues: write

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_HEAD: 2386b7cc1dd7ddc91e9d3707bd6ee6f48f731abd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compare current and proposed limits without running the test suite
        run: python3 .gc-evidence/run.py
      - name: Upload raw logs, environment, patch, and summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gc-cutoff-evidence
          path: gc-evidence-results/
          retention-days: 30
      - name: Publish evidence and report completion on the PR source commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_JOB_STATUS: ${{ job.status }}
          EVIDENCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .gc-evidence/report.py
